[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checkitai-multimodal-etl"
version = "0.1.0"
description = "Pipeline ETL multimodal pour le projet CheckIt.AI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rdflib>=7.6.0",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
